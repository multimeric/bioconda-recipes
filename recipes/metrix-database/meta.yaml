{% set name = "metrix-database" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/ccp4/{{ name }}/archive/main.tar.gz
  sha256: d5558cd419c8d46bdc958064cb97f963d1ea793866414c025906ec15033512ed

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.6
    - pip
    - setuptools
  run:
    - sqlalchemy
    - pandas

test:
  imports:
    - metrix_database

about:
  home: https://github.com/ccp4/metrix-database
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE
  summary: 'Database tools for metrix crystallography data'
  description: |
    Metrix database provides database tools and utilities for managing
    macromolecular crystallography data in the metrix ecosystem.
  dev_url: https://github.com/ccp4/metrix-database

extra:
  recipe-maintainers:
    - multimeric
