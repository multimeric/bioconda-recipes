{% set name = "dui" %}
{% set version = "2021.11.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/ccp4/DUI/archive/refs/tags/v{{ version }}.tar.gz
  sha256: ""  # TODO: Add SHA256 checksum

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - dui=dui.main_dui:main

requirements:
  host:
    - python >=3.7
    - pip
    - setuptools
    - pyside2
  run:
    - python >=3.7
    - pyside2
    - dials
    - numpy
    - psutil

test:
  imports:
    - dui
  commands:
    - dui --help

about:
  home: https://github.com/ccp4/DUI
  license: GPL-2.0-only
  license_family: GPL
  license_file: LICENSE
  summary: 'CCP4 DIALS User Interface'
  description: |
    DIALS User Interface (DUI) is a GUI to allow the general user to run DIALS 
    tools and inspect the output without resorting to detailed command-line usage.
    DIALS is a set of command-line tools for processing X-ray diffraction data.
    Development of DUI is funded by CCP4 and Diamond Light Source.
  dev_url: https://github.com/ccp4/DUI

extra:
  recipe-maintainers:
    - your-github-username
