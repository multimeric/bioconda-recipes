{% set name = "edutils" %}
{% set version = "0.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/ccp4/EDutils/archive/main.tar.gz
  sha256: 616c2a7847612da07a21ede129a990318a7b04cded2e6316662be9457acdb0b0

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools
  run:
    - python >=3.8
    - crystals
    - easygui
    - cbf
    - tifffile
    - pickle5

test:
  imports:
    - EDutils

about:
  home: https://github.com/ccp4/EDutils
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE
  summary: 'Utilities for continuous electron diffraction simulations'
  description: |
    EDutils provides utilities for continuous electron diffraction simulations,
    supporting various ED data processing and analysis tasks.
  dev_url: https://github.com/ccp4/EDutils

extra:
  recipe-maintainers:
    - your-github-username
