{% set name = "dui2" %}
{% set version = "2026.1.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/ccp4/DUI2/archive/refs/tags/v{{ version }}.tar.gz
  sha256: ""  # TODO: Add SHA256 checksum

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - dui2_server=dui2.only_server:main
    - dui2_multi_user_server=dui2.multi_user.http_multi_user_system:main
    - dui2=dui2.all_local_all_ram:main
    - dui2_old_stable=dui2.all_local:main
    - dui2_client=dui2.only_client:main
    - dui2_login=dui2.multi_user.client_gui:main

requirements:
  host:
    - python >=3.7
    - pip
    - setuptools
  run:
    - python >=3.7
    - requests >2
    - h5py >=3.7.0
    - pyside2 >5.15.1
    - dials

test:
  imports:
    - dui2
  commands:
    - dui2 --help

about:
  home: https://github.com/ccp4/DUI2
  license: GPL-2.0-only
  license_family: GPL
  license_file: LICENSE
  summary: 'Client/server implementation of DUI (DIALS User Interface)'
  description: |
    DUI2 is a client/server implementation of the DIALS User Interface for 
    macromolecular crystallography data processing. It provides a graphical 
    interface for the DIALS suite and supports both local and remote execution.
  dev_url: https://github.com/ccp4/DUI2

extra:
  recipe-maintainers:
    - your-github-username
